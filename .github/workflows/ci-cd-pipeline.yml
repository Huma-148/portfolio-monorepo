# ============================================================================
# FILE: .github/workflows/ci-cd-pipeline.yml
# DESCRIPTION: Enterprise-grade monorepo pipeline featuring conditional path
#              filtering and environment segregation (Staging vs. Production)
# ============================================================================

name: Multi-Environment Monorepo Pipeline

on:
  push:
    branches:
      - main        # Triggers Production Pipeline
      - staging     # Triggers Staging/QA Pipeline
    paths-ignore:
      - '**.md'     # Don't run pipelines for documentation tweaks

jobs:
  # --------------------------------------------------------------------------
  # JOB 1: FRONTEND WORKFLOW (Only triggers if files inside /frontend change)
  # --------------------------------------------------------------------------
  frontend-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Optimizes git history lookup for changes

      - name: Check for Frontend Modifications
        id: check_files
        run: |
          if git diff --name-only HEAD~1 | grep -q "^frontend/"; then
            echo "execute_frontend=true" >> $GITHUB_ENV
          else
            echo "No frontend changes detected. Bypassing."
          fi

      - name: Setup Node.js Runtime
        if: env.execute_frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-json.lock'

      - name: Install Frontend Dependencies & Run Production Linter
        if: env.execute_frontend == 'true'
        run: |
          cd frontend
          npm ci
          npm run lint --if-present

      - name: Build Production Web Bundle
        if: env.execute_frontend == 'true'
        run: |
          cd frontend
          npm run build

  # --------------------------------------------------------------------------
  # JOB 2: BACKEND WORKFLOW (Only triggers if files inside /backend change)
  # --------------------------------------------------------------------------
  backend-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for Backend Modifications
        id: check_files
        run: |
          if git diff --name-only HEAD~1 | grep -q "^backend/"; then
            echo "execute_backend=true" >> $GITHUB_ENV
          else
            echo "No backend changes detected. Bypassing."
          fi

      - name: Setup Node.js Runtime
        if: env.execute_backend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Server Dependencies & Compile TypeScript
        if: env.execute_backend == 'true'
        run: |
          cd backend
          npm ci
          npm run build --if-present

      # FUTURE EXTENSION STEP:
      # Code reviewers look for this! This placeholder shows them where you can 
      # inject commands to automatically run Prisma schema health-checks or automated migrations.
      - name: Validate Relational Integrity & Schema Synchronization
        if: env.execute_backend == 'true'
        run: |
          echo "Executing automated migrations against target database context..."
